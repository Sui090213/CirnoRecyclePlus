name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          # sdkmanager 需要 JDK 17; 构建本身仍使用 setup-java 的 JDK 25.
          export JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Package flashable module zip
        run: bash scripts/package-module.sh

      - name: Package standalone ColorOS OTA disabler module
        run: bash scripts/package-ota-module.sh

      - name: Collect standalone APK and source zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "dist/Cirno-Recycle-Plus-v${VERSION}.apk"
          git archive --format=zip --output "dist/Cirno-Recycle-Plus-v${VERSION}-source.zip" HEAD
          cd dist
          rm -f CHECKSUMS-ota.txt
          sha256sum *.apk *.zip > CHECKSUMS.txt

      - name: Show artifacts
        run: |
          ls -lh dist/
          cat dist/CHECKSUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Cirno Recycle+ ${{ github.ref_name }}${{ contains(github.ref_name, 'beta') && '（测试版）' || '' }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'test') }}
          files: |
            dist/*
          body: |
            Cirno Recycle+ ${{ github.ref_name }}

            基于 [Freezer-Team/Cirno](https://github.com/Freezer-Team/Cirno) 二次修改，GPL-3.0。

            如果这是 `beta` / `test` tag，它会被自动标记为 **Pre-release（测试版）**，不要当作稳定版使用。

            刷入 `Cirno-Recycle-Plus-*.zip` 后会**自动安装配套 APK**；重启后在 LSPosed 中启用模块即可。

            `Cirno-ColorOS17-OTA-Disabler-*.zip` 是**独立可选**的 ColorOS 17 系统更新禁用模块，不需要 Cirno Recycle+ 也能单独刷入；卸载即恢复更新包。
            详见 [README.md](https://github.com/${{ github.repository }}/blob/main/README.md)。
