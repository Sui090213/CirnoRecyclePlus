name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          sdkmanager --licenses >/dev/null || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Package flashable module zip
        run: bash scripts/package-module.sh

      - name: Show artifacts
        run: |
          ls -lh dist/
          cat dist/CHECKSUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Cirno Recycle+ ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            dist/*.zip
            dist/CHECKSUMS.txt
          body: |
            Cirno Recycle+ ${{ github.ref_name }}

            基于 [Freezer-Team/Cirno](https://github.com/Freezer-Team/Cirno) 二次修改，GPL-3.0。

            刷入 `Cirno-Recycle-Plus-*.zip` 后会**自动安装配套 APK**；重启后在 LSPosed 中启用模块即可。
            详见 [README.md](https://github.com/${{ github.repository }}/blob/main/README.md)。
